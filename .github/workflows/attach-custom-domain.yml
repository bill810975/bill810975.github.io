# Attaches the muhengli.dev custom domain to this GitHub Pages site as soon as
# DNS points at GitHub Pages, and turns on "Enforce HTTPS" once GitHub has
# issued the certificate. Until then it is a no-op. It is idempotent, so it can
# run repeatedly; delete the file once https://muhengli.dev is live.
name: Attach custom domain (muhengli.dev)

on:
  push:
    paths:
      - .github/workflows/attach-custom-domain.yml
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: attach-custom-domain
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether muhengli.dev resolves to GitHub Pages
        id: dns
        run: |
          ips="$(dig +short muhengli.dev A | sort | tr '\n' ' ')"
          echo "A records: ${ips:-<none>}"
          if echo "$ips" | grep -qE '185\.199\.10[89]\.153|185\.199\.11[01]\.153'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "DNS does not point at GitHub Pages yet - nothing to do."
          fi

      - name: Attach custom domain
        if: steps.dns.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          if ! resp="$(curl -sS --fail-with-body -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" -d '{"cname":"muhengli.dev"}')"; then
            echo "Failed to attach custom domain:"
            echo "$resp"
            exit 1
          fi
          echo "$resp" | jq -c '{cname, status, html_url}'

      - name: Enable HTTPS once the certificate is issued
        if: steps.dns.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          for attempt in $(seq 1 10); do
            resp="$(curl -sS -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" -d '{"cname":"muhengli.dev","https_enforced":true}')"
            if [ "$(echo "$resp" | jq -r '.https_enforced // false')" = "true" ]; then
              echo "HTTPS enforcement enabled."
              echo "$resp" | jq -c '{cname, https_enforced, certificate: .https_certificate.state}'
              exit 0
            fi
            echo "attempt ${attempt}/10: certificate not ready yet"
            sleep 30
          done
          echo "Certificate still pending - the scheduled run will finish this automatically."

      - name: Report live status
        if: steps.dns.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$api" |
            jq -c '{cname, https_enforced, certificate: .https_certificate.state, status}'
          echo "--- https://muhengli.dev ---"
          curl -sSI --max-time 20 https://muhengli.dev | head -3 || true
          curl -sS --max-time 20 https://muhengli.dev | grep -o "<title>[^<]*</title>" || true
